[project]
name = "blockhead-clikit"
version = "0.1.2"
description = "A reusable click + rich + questionary CLI framework. Import as `cli_kit`."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1,<9",
    "rich>=13.7,<14",
    "questionary>=2.0,<3",
]

[project.optional-dependencies]
# Django management-command bridge (cli_kit.django_cmd). Django is imported
# lazily, so it is only needed by consumers that use ActionCommand.
django = [
    "django>=5.2,<6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cli_kit"]

[tool.hatch.build.targets.wheel.force-include]
# ship the package README so `cp -r`/inspection parity is preserved
"cli_kit/README.md" = "cli_kit/README.md"
# PEP 561 marker so downstream type checkers trust our inline annotations
"cli_kit/py.typed" = "cli_kit/py.typed"

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["cli_kit/tests"]
addopts = "-q"
