[project]
name = "blockhead-clikit"
version = "0.1.3"
description = "A reusable click + rich + questionary CLI framework. Import as `cli_kit`."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Steve Motola", email = "steve.motola@gmail.com" },
]
keywords = ["cli", "click", "rich", "questionary", "tui", "menu", "prompt", "terminal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: User Interfaces",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.1,<9",
    "rich>=15.0.0,<16",
    "questionary>=2.0,<3",
]

[project.urls]
Homepage = "https://github.com/mojo5000/blockhead-clikit"
Repository = "https://github.com/mojo5000/blockhead-clikit"
Issues = "https://github.com/mojo5000/blockhead-clikit/issues"
Changelog = "https://github.com/mojo5000/blockhead-clikit/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Django management-command bridge (cli_kit.django_cmd). Django is imported
# lazily, so it is only needed by consumers that use ActionCommand.
django = [
    "django>=6.0.7,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cli_kit"]

[tool.hatch.build.targets.wheel.force-include]
# ship the package README so `cp -r`/inspection parity is preserved
"cli_kit/README.md" = "cli_kit/README.md"
# PEP 561 marker so downstream type checkers trust our inline annotations
"cli_kit/py.typed" = "cli_kit/py.typed"

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.1.0,<8",
    "ruff>=0.16.0,<1",
    "mypy>=1.7,<3",
    "pre-commit>=3,<5",
]

[tool.pytest.ini_options]
testpaths = ["cli_kit/tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Aligned with the house ruleset (zigablocks): pycodestyle (E/W), pyflakes (F),
# mccabe (C90), isort (I), naming (N), pyupgrade (UP), bugbear (B),
# flake8-builtins (A), bandit-security (S), flake8-print (T20), comprehensions (C4).
select = ["E", "F", "W", "C90", "I", "N", "UP", "B", "A", "S", "T20", "C4"]
ignore = [
    # Our public exception names (Aborted, CommandFailed) are a stable API
    # contract — renaming them to *Error would be a breaking change.
    "N818",
]

[tool.ruff.lint.per-file-ignores]
# sh.py is a subprocess runner *by design* — flagging every subprocess call
# (S603) is noise; the whole module's job is to shell out.
"cli_kit/sh.py" = ["S603"]
# tests may shadow builtins (A), use `assert` (S101), and carry fake
# secret fixtures (S105/S106).
"cli_kit/tests/*" = ["A", "S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
# Type the shipped library; tests are exercised by pytest, not the type gate.
files = ["cli_kit"]
exclude = ["cli_kit/tests/"]

[[tool.mypy.overrides]]
# The Django bridge is optional and imported lazily; Django ships no stubs,
# so don't fail the whole run on its untyped imports.
module = ["django.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["cli_kit"]
omit = ["cli_kit/tests/*"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "pragma: no cover",
]
