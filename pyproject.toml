[project]
name = "blockhead-clikit"
version = "0.1.2"
description = "A reusable click + rich + questionary CLI framework. Import as `cli_kit`."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Steve Motola", email = "steve.motola@gmail.com" },
]
keywords = ["cli", "click", "rich", "questionary", "tui", "menu", "prompt", "terminal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: User Interfaces",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.1,<9",
    "rich>=15.0.0,<16",
    "questionary>=2.0,<3",
]

[project.urls]
Homepage = "https://github.com/mojo5000/blockhead-clikit"
Repository = "https://github.com/mojo5000/blockhead-clikit"
Issues = "https://github.com/mojo5000/blockhead-clikit/issues"
Changelog = "https://github.com/mojo5000/blockhead-clikit/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Django management-command bridge (cli_kit.django_cmd). Django is imported
# lazily, so it is only needed by consumers that use ActionCommand.
django = [
    "django>=5.2,<6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cli_kit"]

[tool.hatch.build.targets.wheel.force-include]
# ship the package README so `cp -r`/inspection parity is preserved
"cli_kit/README.md" = "cli_kit/README.md"
# PEP 561 marker so downstream type checkers trust our inline annotations
"cli_kit/py.typed" = "cli_kit/py.typed"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["cli_kit/tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# A sensible, non-fussy default set: pyflakes (F), pycodestyle (E/W), isort (I),
# bugbear (B), pyupgrade (UP), flake8-builtins (A), comprehensions (C4).
select = ["E", "W", "F", "I", "B", "UP", "A", "C4"]

[tool.ruff.lint.per-file-ignores]
# tests may shadow builtins and use assert-heavy patterns freely
"cli_kit/tests/*" = ["A"]

[tool.coverage.run]
source = ["cli_kit"]
omit = ["cli_kit/tests/*"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "pragma: no cover",
]
