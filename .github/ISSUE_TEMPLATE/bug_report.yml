name: Bug report
description: Report a problem with blockhead-clikit
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal code or commands that trigger the issue.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: blockhead-clikit version
      placeholder: "e.g. 0.1.0 (or a git commit/tag)"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "e.g. 3.12.4"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "e.g. macOS 15, Ubuntu 24.04"
    validations:
      required: false
