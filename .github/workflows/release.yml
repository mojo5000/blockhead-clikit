name: Release

# Publishes to PyPI when a GitHub Release is published. Nothing is published
# on push or PR — you cut a release (from a version tag) to trigger this.
#
# Uses PyPI Trusted Publishing (OIDC): no API token/secret is stored. Before
# the first release, configure a trusted publisher on PyPI for this project
# pointing at this repo + workflow. See:
# https://docs.pypi.org/trusted-publishers/
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Build sdist + wheel
        run: uv build
      - name: Check metadata
        run: uvx twine check dist/*
      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/blockhead-clikit
    permissions:
      id-token: write  # required for OIDC trusted publishing
    steps:
      - name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
