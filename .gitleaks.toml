# Gitleaks configuration. Inherits the default ruleset and adds an allowlist
# for known false positives (doc placeholders, test fixtures).
#
# To add a new exception:
#   - Prefer narrowing a regex below over excluding a whole path.
#   - For doc placeholder tokens (e.g. YOUR_TOKEN_HERE, <paste-here>), the
#     placeholder regex already covers most patterns.

[extend]
useDefault = true

[allowlist]
description = "Project-wide allowlist for known false positives"

regexes = [
  # Documentation placeholders: ALLCAPS, kebab-case, or bracketed markers.
  '''(?i)bearer\s+(your[_-]?token|access[_-]?token|<[^>]+>|xxx+|\.\.\.|REPLACE_ME)''',
]
